version: '3'

# tt — build & install (go-task)
#
# tt is a Go program, so there is a build step:
#   go-task build        -> bin/tt              (local build output)
#   go-task install      -> ~/.local/bin/tt     (the live tool; restarts ttd)
#   go-task restore-bash -> recover the retired bash tool from its tag
#
# `bin/` is the usual home for a local Go build; `dist/` is left for release
# artifacts (GoReleaser's default), which this repo does not produce. The
# binary is plain `tt` — it lived in the repo root as `tt-go` only while the
# bash script still occupied ./tt.

vars:
  BIN_DIR: '{{.BIN_DIR | default (printf "%s/.local/bin" .HOME)}}'
  BASH_TAG: v0.15.3-bash-final

env:
  CGO_ENABLED: '0'

tasks:
  default:
    desc: Build, vet and test
    cmds:
      - task: check

  build:
    desc: Compile the tt binary to bin/tt
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - bin/tt
    cmds:
      - go build -o bin/tt .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run the unit tests
    cmds:
      - go test ./...

  check:
    desc: Build + vet + test — run this after every change
    cmds:
      - task: build
      - task: vet
      - task: test

  fmt:
    desc: gofmt the tree
    cmds:
      - gofmt -w .

  install:
    desc: Install bin/tt as the live tt (restarts ttd)
    aliases: [cutover]
    deps: [check]
    cmds:
      - mkdir -p '{{.BIN_DIR}}'
      - rm -f '{{.BIN_DIR}}/tt'
      - install -m 0755 bin/tt '{{.BIN_DIR}}/tt'
      # ttd is long-lived: without this it keeps serving the PREVIOUS binary and
      # your change silently does nothing. It restarts on the next CLI call.
      - '{{.BIN_DIR}}/tt daemon stop || true'
      - 'echo "installed {{.BIN_DIR}}/tt (ttd restarted)"'

  restore-bash:
    desc: Emergency fallback — restore the retired bash tool from its tag
    cmds:
      - git checkout {{.BASH_TAG}} -- tt
      - chmod +x tt
      - rm -f '{{.BIN_DIR}}/tt'
      - ln -s '{{.ROOT_DIR}}/tt' '{{.BIN_DIR}}/tt'
      - 'echo "restored: {{.BIN_DIR}}/tt -> {{.ROOT_DIR}}/tt (bash {{.BASH_TAG}})"'
      - 'echo "NOTE: ./tt is now an untracked checkout of the retired script."'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
